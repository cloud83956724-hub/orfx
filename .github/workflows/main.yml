name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32z1-dev liblz4-tool libncurses5-dev libncurses6 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev python3

      - name: Install Repo
        run: |
          mkdir -p ~/.bin
          PATH="${HOME}/.bin:${PATH}"
          curl https://storage.googleapis.com/git-repo-binutils/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo

      - name: Initialize OrangeFox Manifest
        run: |
          mkdir workspace
          cd workspace
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init -u https://gitlab.com/OrangeFox/manifest.git -b fox_11.0
          repo sync -j$(nproc --all) --force-sync

      - name: Clone Device Tree
        run: |
          cd workspace
          git clone https://github.com/OrangeFoxRecovery/device_samsung_hero2lte.git device/samsung/hero2lte -b fox_11.0

      - name: Start Building
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_hero2lte-eng
          mka recoveryimage
